# Builds every mod in Valheim.Mods.sln and produces valheim-modpack.zip.
#
# The game DLLs are not in the repository (proprietary): the Valheim dedicated server, which contains the same game
# code, is downloaded with SteamCMD using an anonymous login. BepInEx is installed by install.ps1, which tests the
# script along the way. A v* tag publishes a release with the archive, which install.ps1 downloads.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Both install scripts run alone through irm | iex, so they share their functions by copy between markers.
      # They must also stay ASCII without BOM: Windows PowerShell 5.1 reads them with a legacy code page.
      - name: Check install scripts (shared block, ASCII)
        shell: pwsh
        run: |
          $pattern = '(?s)# ===== BEGIN SHARED BLOCK.*?# ===== END SHARED BLOCK ====='
          $blocks = foreach ($script in 'install.ps1', 'install-server.ps1') {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $script))
            if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) { throw "$script contains non-ASCII characters." }
            $match = [regex]::Match([Text.Encoding]::ASCII.GetString($bytes), $pattern)
            if (-not $match.Success) { throw "Shared block markers not found in $script." }
            $match.Value -replace "`r`n", "`n"
          }
          if ($blocks[0] -cne $blocks[1]) {
            throw 'The shared block differs between install.ps1 and install-server.ps1: make the change in both files.'
          }
          Write-Host 'Shared block identical, both scripts ASCII'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      # Only valheim_server_Data\Managed is needed to build. It is cached under the server's Steam build id, which
      # changes with every patch: the 2 GB server is only downloaded again after a Valheim update.
      - name: SteamCMD and dedicated server build id
        id: server
        shell: pwsh
        run: |
          $steamcmd = Join-Path $env:RUNNER_TEMP 'steamcmd'
          New-Item -ItemType Directory -Force $steamcmd | Out-Null
          Invoke-WebRequest https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip -OutFile "$steamcmd\steamcmd.zip"
          Expand-Archive "$steamcmd\steamcmd.zip" $steamcmd -Force
          "STEAMCMD=$steamcmd\steamcmd.exe" >> $env:GITHUB_ENV

          # Separate first launch: SteamCMD updates itself during it, and any command passed to that same launch
          # fails ("Missing configuration").
          & "$steamcmd\steamcmd.exe" +quit | Out-Null

          $buildid = $null
          for ($attempt = 1; $attempt -le 3 -and -not $buildid; $attempt++) {
            $info = & "$steamcmd\steamcmd.exe" +login anonymous +app_info_update 1 +app_info_print 896660 +quit | Out-String
            $m = [regex]::Match($info, '"branches"\s*\{\s*"public"\s*\{\s*"buildid"\s*"(\d+)"')
            if ($m.Success) { $buildid = $m.Groups[1].Value }
          }
          if (-not $buildid) {
            # Without a build id, the key is unique to this run: no cache, but the build goes on.
            Write-Host "::warning::Could not read the dedicated server build id, cache skipped for this run"
            $buildid = "unknown-$env:GITHUB_RUN_ID"
          }
          Write-Host "Dedicated server build id: $buildid"
          "buildid=$buildid" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - name: Game DLL cache
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\valheim\valheim_server_Data\Managed
          key: valheim-server-managed-${{ steps.server.outputs.buildid }}

      - name: Download dedicated server
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $valheim = Join-Path $env:RUNNER_TEMP 'valheim'
          $managed = Join-Path $valheim 'valheim_server_Data\Managed'
          for ($attempt = 1; $attempt -le 3 -and -not (Test-Path "$managed\assembly_valheim.dll"); $attempt++) {
            Write-Host "SteamCMD, attempt $attempt"
            & $env:STEAMCMD +force_install_dir $valheim +login anonymous +app_update 896660 validate +quit
          }
          $global:LASTEXITCODE = 0

      - name: Check game DLLs
        shell: pwsh
        run: |
          $valheim = Join-Path $env:RUNNER_TEMP 'valheim'
          $managed = Join-Path $valheim 'valheim_server_Data\Managed'
          foreach ($dll in 'assembly_valheim', 'assembly_utils', 'assembly_guiutils', 'Unity.TextMeshPro', 'UnityEngine', 'com.rlabrecque.steamworks.net') {
            if (-not (Test-Path "$managed\$dll.dll")) { throw "Missing from the dedicated server: $dll.dll" }
          }
          $version = ./.github/scripts/Get-ValheimVersion.ps1 "$managed\assembly_valheim.dll"
          Write-Host "Building against Valheim $version"
          $cache = if ('${{ steps.cache.outputs.cache-hit }}' -eq 'true') { 'hit' } else { 'miss, server downloaded' }
          @(
            '### Game DLLs'
            ''
            "- Valheim: $version"
            "- Dedicated server Steam build id: ${{ steps.server.outputs.buildid }}"
            "- Cache: $cache"
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY
          "VALHEIM_INSTALL=$valheim" >> $env:GITHUB_ENV

      - name: BepInEx (through install-server.ps1)
        shell: pwsh
        run: ./install-server.ps1 -ServerPath $env:VALHEIM_INSTALL -BepInExOnly

      - name: Build
        run: dotnet build Valheim.Mods.sln -c Release

      - name: Package valheim-modpack.zip
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'package'
          $plugins = Join-Path $package 'BepInEx\plugins'
          $projects = dotnet sln Valheim.Mods.sln list | Where-Object { $_ -like '*.csproj' }
          foreach ($project in $projects) {
            $name = ([xml](Get-Content $project)).Project.PropertyGroup.AssemblyName | Where-Object { $_ } | Select-Object -First 1
            $dll = Join-Path (Split-Path $project) "bin\Release\$name.dll"
            if (-not (Test-Path $dll)) { throw "DLL not found: $dll" }
            New-Item -ItemType Directory -Force (Join-Path $plugins $name) | Out-Null
            Copy-Item $dll (Join-Path $plugins $name)
            Write-Host "$name $((Get-Item $dll).VersionInfo.FileVersion)"
          }
          Compress-Archive -Path "$package\*" -DestinationPath valheim-modpack.zip -Force

      # The CI environment variable makes both scripts non-interactive: no menu, the parameters decide.
      - name: Test install scripts
        shell: pwsh
        run: |
          $zip = (Resolve-Path 'valheim-modpack.zip').Path
          # A mod whose DLL description starts with "Experimental" is left out of the default install.
          $packageMods = @(Get-ChildItem "$env:RUNNER_TEMP\package\BepInEx\plugins" -Directory | Sort-Object Name | ForEach-Object {
            $description = (Get-Item (Join-Path $_.FullName "$($_.Name).dll")).VersionInfo.Comments
            [pscustomobject]@{ Name = $_.Name; Experimental = ($description -match '^\s*Experimental\b') }
          })
          $defaultMods = (@($packageMods | Where-Object { -not $_.Experimental } | ForEach-Object Name)) -join ', '
          $experimentalMods = @($packageMods | Where-Object { $_.Experimental } | ForEach-Object Name)
          # The server list is read from the script itself, so the test follows any change to $ServerMods.
          $serverList = [regex]::Match((Get-Content install-server.ps1 -Raw), '\$ServerMods = @\(([^)]*)\)').Groups[1].Value
          $serverMods = (@([regex]::Matches($serverList, "'([^']+)'") | ForEach-Object { $_.Groups[1].Value }) | Sort-Object) -join ', '
          if (-not $serverMods) { throw 'Could not read $ServerMods from install-server.ps1' }

          function New-Target([string]$name) {
            $folder = Join-Path $env:RUNNER_TEMP "test-$name"
            New-Item -ItemType Directory -Force $folder | Out-Null
            return $folder
          }
          function Get-Mods([string]$folder) {
            (@(Get-ChildItem (Join-Path $folder 'BepInEx\plugins') -Directory -ErrorAction SilentlyContinue | ForEach-Object Name | Sort-Object)) -join ', '
          }
          function Assert-Equal([string]$what, $actual, $expected) {
            if ("$actual" -ne "$expected") { throw "${what}: got [$actual], expected [$expected]" }
            Write-Host "ok: $what"
          }
          function Assert-BepInEx([string]$folder) {
            foreach ($file in 'BepInEx\core\BepInEx.dll', 'winhttp.dll') {
              if (-not (Test-Path (Join-Path $folder $file))) { throw "Missing after install in ${folder}: $file" }
            }
          }

          # Empty folders: every mod for the game, exactly the server mods for the server.
          $game = New-Target 'game'
          ./install.ps1 -ValheimPath $game -ZipPath $zip
          Assert-BepInEx $game
          Assert-Equal 'install.ps1 installs every non-experimental mod' (Get-Mods $game) $defaultMods

          $server = New-Target 'server'
          ./install-server.ps1 -ServerPath $server -ZipPath $zip
          Assert-BepInEx $server
          Assert-Equal 'install-server.ps1 installs the server mods' (Get-Mods $server) $serverMods

          # -Mods as a single comma-separated string (what powershell -File passes), in another case.
          $subset = New-Target 'subset'
          ./install.ps1 -ValheimPath $subset -ZipPath $zip -Mods 'stackmax, QuickBrew'
          Assert-Equal '-Mods installs only the given mods' (Get-Mods $subset) 'QuickBrew, StackMax'

          # An experimental mod is installed when named in -Mods.
          foreach ($mod in $experimentalMods) {
            $folder = New-Target "experimental-$mod"
            ./install.ps1 -ValheimPath $folder -ZipPath $zip -Mods $mod
            Assert-Equal "-Mods installs experimental $mod" (Get-Mods $folder) $mod
          }

          # Uninstalling one mod with its settings leaves the other mod, its settings and BepInEx's own BepInEx.cfg
          # (shipped by BepInExPack).
          $config = Join-Path $subset 'BepInEx\config'
          New-Item -ItemType Directory -Force $config | Out-Null
          foreach ($file in 'valheim.quickbrew.cfg', 'valheim.stackmax.cfg') { 'x' | Set-Content (Join-Path $config $file) }
          ./install.ps1 -ValheimPath $subset -Uninstall -Mods QuickBrew -RemoveConfig
          Assert-Equal '-Uninstall -Mods removes only that mod' (Get-Mods $subset) 'StackMax'
          Assert-Equal '-RemoveConfig deletes only its settings' ((Get-ChildItem $config -File | ForEach-Object Name | Sort-Object) -join ', ') 'BepInEx.cfg, valheim.stackmax.cfg'

          # Resetting settings deletes those of every modpack mod, installed (StackMax) or not (QuickBrew), keeps the
          # mods installed and leaves settings that are not the modpack's.
          foreach ($file in 'valheim.quickbrew.cfg', 'other.mod.cfg') { 'x' | Set-Content (Join-Path $config $file) }
          ./install.ps1 -ValheimPath $subset -ZipPath $zip -ResetConfig
          Assert-Equal '-ResetConfig keeps the mods installed' (Get-Mods $subset) 'StackMax'
          Assert-Equal '-ResetConfig deletes only the modpack settings' ((Get-ChildItem $config -File | ForEach-Object Name | Sort-Object) -join ', ') 'BepInEx.cfg, other.mod.cfg'

          # Uninstalling the modpack leaves mods installed from elsewhere, and BepInEx.
          New-Item -ItemType Directory -Force (Join-Path $server 'BepInEx\plugins\OtherMod') | Out-Null
          ./install-server.ps1 -ServerPath $server -ZipPath $zip -Uninstall
          Assert-Equal '-Uninstall keeps mods from elsewhere' (Get-Mods $server) 'OtherMod'
          Assert-BepInEx $server

          # Removing BepInEx leaves exactly the files that were there before the install.
          'x' | Set-Content (Join-Path $game 'valheim.exe')
          ./install.ps1 -ValheimPath $game -ZipPath $zip -Uninstall -RemoveBepInEx
          Assert-Equal '-RemoveBepInEx leaves only the game files' ((Get-ChildItem $game -Force | ForEach-Object Name) -join ', ') 'valheim.exe'

      - uses: actions/upload-artifact@v7
        with:
          name: valheim-modpack
          path: valheim-modpack.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME valheim-modpack.zip install.ps1 install-server.ps1 --title $env:GITHUB_REF_NAME --generate-notes
