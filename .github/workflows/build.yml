# Builds every mod in Valheim.Mods.sln and produces valheim-modpack.zip.
#
# The game DLLs are not in the repository (proprietary): the Valheim dedicated server, which contains the same game
# code, is downloaded with SteamCMD using an anonymous login. BepInEx is installed by install.ps1, which tests the
# script along the way. A v* tag publishes a release with the archive, which install.ps1 downloads.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      # Only valheim_server_Data\Managed is needed to build. It is cached under the server's Steam build id, which
      # changes with every patch: the 2 GB server is only downloaded again after a Valheim update.
      - name: SteamCMD and dedicated server build id
        id: server
        shell: pwsh
        run: |
          $steamcmd = Join-Path $env:RUNNER_TEMP 'steamcmd'
          New-Item -ItemType Directory -Force $steamcmd | Out-Null
          Invoke-WebRequest https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip -OutFile "$steamcmd\steamcmd.zip"
          Expand-Archive "$steamcmd\steamcmd.zip" $steamcmd -Force
          "STEAMCMD=$steamcmd\steamcmd.exe" >> $env:GITHUB_ENV

          # Separate first launch: SteamCMD updates itself during it, and any command passed to that same launch
          # fails ("Missing configuration").
          & "$steamcmd\steamcmd.exe" +quit | Out-Null

          $buildid = $null
          for ($attempt = 1; $attempt -le 3 -and -not $buildid; $attempt++) {
            $info = & "$steamcmd\steamcmd.exe" +login anonymous +app_info_update 1 +app_info_print 896660 +quit | Out-String
            $m = [regex]::Match($info, '"branches"\s*\{\s*"public"\s*\{\s*"buildid"\s*"(\d+)"')
            if ($m.Success) { $buildid = $m.Groups[1].Value }
          }
          if (-not $buildid) {
            # Without a build id, the key is unique to this run: no cache, but the build goes on.
            Write-Host "::warning::Could not read the dedicated server build id, cache skipped for this run"
            $buildid = "unknown-$env:GITHUB_RUN_ID"
          }
          Write-Host "Dedicated server build id: $buildid"
          "buildid=$buildid" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - name: Game DLL cache
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\valheim\valheim_server_Data\Managed
          key: valheim-server-managed-${{ steps.server.outputs.buildid }}

      - name: Download dedicated server
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $valheim = Join-Path $env:RUNNER_TEMP 'valheim'
          $managed = Join-Path $valheim 'valheim_server_Data\Managed'
          for ($attempt = 1; $attempt -le 3 -and -not (Test-Path "$managed\assembly_valheim.dll"); $attempt++) {
            Write-Host "SteamCMD, attempt $attempt"
            & $env:STEAMCMD +force_install_dir $valheim +login anonymous +app_update 896660 validate +quit
          }
          $global:LASTEXITCODE = 0

      - name: Check game DLLs
        shell: pwsh
        run: |
          $valheim = Join-Path $env:RUNNER_TEMP 'valheim'
          $managed = Join-Path $valheim 'valheim_server_Data\Managed'
          foreach ($dll in 'assembly_valheim', 'assembly_utils', 'assembly_guiutils', 'Unity.TextMeshPro', 'UnityEngine') {
            if (-not (Test-Path "$managed\$dll.dll")) { throw "Missing from the dedicated server: $dll.dll" }
          }
          $version = ./.github/scripts/Get-ValheimVersion.ps1 "$managed\assembly_valheim.dll"
          Write-Host "Building against Valheim $version"
          $cache = if ('${{ steps.cache.outputs.cache-hit }}' -eq 'true') { 'hit' } else { 'miss, server downloaded' }
          @(
            '### Game DLLs'
            ''
            "- Valheim: $version"
            "- Dedicated server Steam build id: ${{ steps.server.outputs.buildid }}"
            "- Cache: $cache"
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY
          "VALHEIM_INSTALL=$valheim" >> $env:GITHUB_ENV

      - name: BepInEx (through install.ps1)
        shell: pwsh
        run: ./install.ps1 -ValheimPath $env:VALHEIM_INSTALL -BepInExOnly

      - name: Build
        run: dotnet build Valheim.Mods.sln -c Release

      - name: Package valheim-modpack.zip
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'package'
          $plugins = Join-Path $package 'BepInEx\plugins'
          $projects = dotnet sln Valheim.Mods.sln list | Where-Object { $_ -like '*.csproj' }
          foreach ($project in $projects) {
            $name = ([xml](Get-Content $project)).Project.PropertyGroup.AssemblyName | Where-Object { $_ } | Select-Object -First 1
            $dll = Join-Path (Split-Path $project) "bin\Release\$name.dll"
            if (-not (Test-Path $dll)) { throw "DLL not found: $dll" }
            New-Item -ItemType Directory -Force (Join-Path $plugins $name) | Out-Null
            Copy-Item $dll (Join-Path $plugins $name)
            Write-Host "$name $((Get-Item $dll).VersionInfo.FileVersion)"
          }
          Compress-Archive -Path "$package\*" -DestinationPath valheim-modpack.zip -Force

      - name: Test install into an empty folder
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'install-test'
          New-Item -ItemType Directory -Force $test | Out-Null
          ./install.ps1 -ValheimPath $test -ZipPath valheim-modpack.zip
          $expected = @('BepInEx\core\BepInEx.dll', 'winhttp.dll') +
            (Get-ChildItem "$env:RUNNER_TEMP\package\BepInEx\plugins" -Directory | ForEach-Object { "BepInEx\plugins\$($_.Name)\$($_.Name).dll" })
          foreach ($file in $expected) {
            if (-not (Test-Path (Join-Path $test $file))) { throw "Missing after install: $file" }
          }
          Write-Host "Install verified: $($expected.Count) files"

      - uses: actions/upload-artifact@v7
        with:
          name: valheim-modpack
          path: valheim-modpack.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME valheim-modpack.zip install.ps1 --title $env:GITHUB_REF_NAME --generate-notes
